server:
  port: 8083

spring:
  application:
    name: bible-module-service

  datasource:
    url: jdbc:h2:file:./data/bible-module;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jackson:
    default-property-inclusion: non_null

# 其他服务地址
bible:
  text-service:
    url: http://localhost:8081
  data:
    sources-url: https://raw.githubusercontent.com/seven1m/open-bibles/main/

logging:
  level:
    com.bible.module: DEBUG