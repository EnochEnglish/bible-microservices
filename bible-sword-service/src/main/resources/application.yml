server:
  port: 8086

spring:
  application:
    name: bible-sword-service

  jackson:
    default-property-inclusion: non_null

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=30m

# ─── SWORD Configuration ───
sword:
  # SWORD module directory (where mods.d/ and modules/ reside)
  modules-path: ${SWORD_MODULES_PATH:data/sword-mods}
  # Module data subdirectory (absolute or relative to modules-path)
  data-path: ${SWORD_DATA_PATH:data/sword-mods}

# ─── Logging ───
logging:
  level:
    com.bible.sword: DEBUG
    org.crosswire: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"

# ─── Actuator ───
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: when-authorized
