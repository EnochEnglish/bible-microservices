<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Reader - 注释版</title>
    <style>
        :root {
            --bg: #f5f0e8; --card: #fffdf7; --primary: #8b4513;
            --primary-light: #d2a679; --text: #2c1810; --text-light: #6b5244;
            --border: #e0d5c5; --verse-num: #b8860b; --highlight: #fff3cd;
            --panel-bg: #fdfbf5;
            --hl-yellow: #fff9c4; --hl-green: #c8e6c9; --hl-blue: #bbdefb;
            --hl-pink: #f8bbd0; --note-bg: #fef9e7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, var(--primary), #6b3410);
            color: #f5e6d3; padding: 12px 16px; display: flex; align-items: center; gap: 12px;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        header h1 { font-size: 1.1em; font-weight: 600; letter-spacing: 2px; white-space: nowrap; }
        .header-controls { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        select, input, button, textarea {
            font-family: inherit; font-size: 0.85em; padding: 6px 10px;
            border: 1px solid var(--border); border-radius: 6px;
            background: var(--card); color: var(--text);
        }
        select { min-width: 90px; cursor: pointer; }
        input[type="text"] { width: 150px; }
        button {
            background: var(--primary); color: #f5e6d3; border: none;
            cursor: pointer; font-weight: 500; transition: background 0.2s; white-space: nowrap;
        }
        button:hover { background: #6b3410; }
        button.sm { font-size: 0.75em; padding: 3px 8px; }
        button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
        button.danger { background: #d32f2f; }
        button.danger:hover { background: #b71c1c; }

        .app { display: flex; height: calc(100vh - 52px); }
        .sidebar {
            width: 200px; min-width: 200px; background: var(--card);
            border-right: 1px solid var(--border); overflow-y: auto; padding: 6px 0;
        }
        .sidebar h3 { padding: 8px 14px 4px; font-size: 0.7em; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; }
        .sidebar .book-item {
            padding: 5px 14px; cursor: pointer; font-size: 0.85em;
            border-left: 3px solid transparent; transition: background 0.15s;
        }
        .sidebar .book-item:hover { background: #f0e8d8; }
        .sidebar .book-item.active { background: #f0e8d8; border-left-color: var(--primary); font-weight: 600; }
        .sidebar .testament-label { padding: 8px 14px 4px; font-size: 0.65em; color: var(--text-light); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }

        .main { flex: 1; overflow-y: auto; padding: 20px 24px; }

        /* Right panel */
        .panel {
            width: 300px; min-width: 300px; background: var(--panel-bg);
            border-left: 1px solid var(--border); overflow-y: auto; padding: 12px;
            transition: width 0.3s;
        }
        .panel.collapsed { width: 36px; min-width: 36px; padding: 8px 4px; }
        .panel.collapsed .panel-body { display: none; }
        .panel-toggle {
            background: var(--primary); color: #f5e6d3; border: none;
            cursor: pointer; width: 28px; height: 28px; border-radius: 50%;
            font-size: 14px; display: flex; align-items: center; justify-content: center;
        }
        .panel-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 10px; }
        .panel-tab {
            flex: 1; text-align: center; padding: 6px 4px; cursor: pointer; font-size: 0.8em;
            border-bottom: 2px solid transparent; margin-bottom: -2px; font-weight: 500;
        }
        .panel-tab.active { border-bottom-color: var(--primary); color: var(--primary); }

        .translation-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .chapter-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .chapter-nav .chap-num { font-weight: 600; min-width: 50px; text-align: center; }

        .verses { max-width: 680px; line-height: 2; font-size: 1em; }
        .verse {
            margin-bottom: 2px; padding: 3px 6px; border-radius: 4px;
            cursor: pointer; transition: background 0.15s; display: flex; gap: 6px;
        }
        .verse:hover { background: #f5edd8; }
        .verse.selected { background: var(--highlight); }
        .verse.hl-yellow { background: var(--hl-yellow); }
        .verse.hl-green { background: var(--hl-green); }
        .verse.hl-blue { background: var(--hl-blue); }
        .verse.hl-pink { background: var(--hl-pink); }
        .verse.has-note { border-left: 3px solid var(--primary); }
        .verse-num {
            color: var(--verse-num); font-size: 0.7em; font-weight: 600;
            min-width: 22px; text-align: right; padding-top: 2px;
        }
        .verse-text { flex: 1; }
        .verse-actions {
            display: none; gap: 2px; padding-top: 2px;
        }
        .verse:hover .verse-actions { display: flex; }
        .verse-actions button {
            font-size: 0.65em; padding: 1px 5px; border-radius: 3px;
            background: transparent; color: var(--text-light); border: 1px solid transparent;
        }
        .verse-actions button:hover { border-color: var(--border); background: white; }

        .random-card {
            background: var(--highlight); border: 1px solid #f0d080; border-radius: 8px;
            padding: 16px 20px; margin-bottom: 16px; max-width: 680px;
        }
        .random-card .ref { font-size: 0.8em; color: var(--text-light); margin-bottom: 8px; }
        .random-card .text { font-size: 1.05em; line-height: 1.8; }

        .search-box { display: flex; gap: 6px; margin-bottom: 16px; }
        .search-results { max-width: 680px; }
        .search-result { padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
        .search-result:hover { background: #faf5eb; }
        .search-result .ref { font-size: 0.85em; color: var(--primary); font-weight: 600; }
        mark { background: var(--highlight); padding: 0 2px; }

        .loading { color: var(--text-light); font-style: italic; padding: 16px; }
        .error { color: #b22222; background: #fee; padding: 10px 14px; border-radius: 6px; margin: 10px 0; }
        .welcome { max-width: 500px; margin: 50px auto; text-align: center; color: var(--text-light); }
        .welcome h2 { font-size: 1.4em; margin-bottom: 10px; color: var(--primary); }

        /* Panel items */
        .commentary-item {
            padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.85em; line-height: 1.6;
        }
        .commentary-item .source { font-size: 0.75em; color: var(--primary); font-weight: 600; }
        .commentary-item .verses { font-size: 0.7em; color: var(--text-light); }
        .note-item {
            padding: 8px; margin: 6px 0; border-radius: 6px; background: var(--note-bg);
            border: 1px solid #f0e0a0; font-size: 0.85em; position: relative;
        }
        .note-item .note-title { font-weight: 600; margin-bottom: 4px; color: var(--primary); }
        .note-item .note-date { font-size: 0.7em; color: var(--text-light); margin-top: 4px; }
        .note-item .note-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
        .crossref-item {
            padding: 4px 0; font-size: 0.85em; cursor: pointer; color: var(--primary);
        }
        .crossref-item:hover { text-decoration: underline; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); z-index: 200; justify-content: center; align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: white; border-radius: 10px; padding: 20px; max-width: 500px; width: 90%;
            max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal h3 { margin-bottom: 12px; color: var(--primary); }
        .modal textarea { width: 100%; min-height: 100px; margin: 8px 0; }
        .modal input { width: 100%; margin: 4px 0; }
        .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

        /* Color picker */
        .color-picker { display: flex; gap: 6px; margin: 8px 0; }
        .color-dot {
            width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: border 0.15s;
        }
        .color-dot:hover, .color-dot.selected { border-color: var(--primary); }
        .color-dot.yellow { background: var(--hl-yellow); }
        .color-dot.green { background: var(--hl-green); }
        .color-dot.blue { background: var(--hl-blue); }
        .color-dot.pink { background: var(--hl-pink); }

        @media (max-width: 900px) {
            .app { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; max-height: 30vh; }
            .panel { width: 100%; min-width: 100%; max-height: 40vh; }
            .main { padding: 12px; }
            input[type="text"] { width: 100px; }
            header h1 { font-size: 0.9em; }
        }
    </style>
</head>
<body>
<header>
    <h1>📖 Bible Reader</h1>
    <div class="header-controls">
        <label>译本</label>
        <select id="translationSelect" onchange="onTranslationChange()"><option>加载中...</option></select>
        <input type="text" id="searchInput" placeholder="搜索经文..." onkeydown="if(event.key==='Enter')doSearch()" />
        <button onclick="doSearch()">🔍</button>
        <button class="secondary" onclick="showRandom()">🎲 随机</button>
    </div>
</header>

<div class="app">
    <div class="sidebar" id="sidebar"><div class="loading">加载书卷...</div></div>
    <div class="main" id="mainContent">
        <div class="welcome"><h2>欢迎使用 Bible Reader</h2><p>选择书卷开始阅读，右侧面板查看注释和笔记</p></div>
    </div>
    <div class="panel" id="rightPanel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div class="panel-tabs">
                <div class="panel-tab active" onclick="switchPanelTab('commentaries')" id="tabCom">📝 注释</div>
                <div class="panel-tab" onclick="switchPanelTab('notes')" id="tabNotes">📒 笔记</div>
                <div class="panel-tab" onclick="switchPanelTab('refs')" id="tabRefs">🔗 引用</div>
            </div>
            <button class="panel-toggle" onclick="togglePanel()" title="折叠">◀</button>
        </div>
        <div class="panel-body" id="panelBody">
            <div class="loading">点击经文查看注释</div>
        </div>
    </div>
</div>

<!-- Note Modal -->
<div class="modal-overlay" id="noteModal">
    <div class="modal">
        <h3 id="noteModalTitle">添加笔记</h3>
        <input type="text" id="noteTitle" placeholder="标题（可选）" />
        <textarea id="noteContent" placeholder="笔记内容..."></textarea>
        <div class="modal-actions">
            <button class="secondary" onclick="closeNoteModal()">取消</button>
            <button onclick="saveNote()">保存</button>
        </div>
    </div>
</div>

<script>
let API = '/api/v1/bible';
let ANN = '/api/v1/annotations';
let currentTranslation = 'kjv';
let currentBook = null, currentChapter = null, selectedVerse = null;
let booksCache = [], bookmarksCache = {}, panelTab = 'commentaries';
let editNoteId = null;

// ============ Init ============
async function init() {
    await loadTranslations();
    await loadBooks();
    await loadBookmarks();
}

async function loadTranslations() {
    try {
        const resp = await fetch(`${API}/translations`);
        const data = await resp.json();
        const sel = document.getElementById('translationSelect');
        sel.innerHTML = '';
        (data.translations||[]).forEach(t => {
            const o = document.createElement('option');
            o.value = t.id; o.textContent = `${t.name} (${t.id})`; sel.appendChild(o);
        });
        currentTranslation = sel.value || 'kjv';
    } catch(e) { console.error(e); }
}

async function loadBooks() {
    try {
        const resp = await fetch(`${API}/${currentTranslation}/books`);
        const data = await resp.json();
        booksCache = data.books || [];
        renderSidebar();
    } catch(e) { console.error(e); }
}

async function loadBookmarks() {
    try {
        const resp = await fetch(`${ANN}/bookmarks/all`);
        bookmarksCache = {};
    } catch(e) {
        // annotations API will be available after rebuild
    }
}

function renderSidebar() {
    const sb = document.getElementById('sidebar');
    let html = '', last = '';
    booksCache.forEach((b,i) => {
        const t = (b.order||0) < 39 ? 'OT' : 'NT';
        if (t !== last) { last=t; html+=`<div class="testament-label">${t==='OT'?'旧约 Old Testament':'新约 New Testament'}</div>`; }
        const act = (b.book_id===currentBook)?' active':'';
        html+=`<div class="book-item${act}" onclick="selectBook('${b.book_id}',${b.chapter_count||1})">${b.name}</div>`;
    });
    sb.innerHTML = html || '<div class="loading">无书卷</div>';
}

// ============ Books & Chapters ============
async function selectBook(bookId, chapterCount) {
    currentBook = bookId; currentChapter = 1; renderSidebar();
    await loadChapter(bookId, 1);
}

async function loadChapter(bookId, chapter) {
    const mc = document.getElementById('mainContent');
    mc.innerHTML = '<div class="loading">加载中...</div>';
    try {
        const resp = await fetch(`${API}/${currentTranslation}/${bookId}/${chapter}`);
        const data = await resp.json();
        if (data.error) { mc.innerHTML = `<div class="error">${data.message||data.error}</div>`; return; }
        currentBook = data.book_id||bookId; currentChapter = data.chapter||chapter;

        let html = `<div class="translation-bar"><strong>${(data.translation_id||currentTranslation).toUpperCase()}</strong> · ${data.book_name||bookId}</div>`;
        const bk = booksCache.find(b => b.book_id===currentBook);
        const max = bk?bk.chapter_count:150;
        html+=`<div class="chapter-nav">
            <button ${currentChapter<=1?'disabled':''} onclick="loadChapter('${currentBook}',${currentChapter-1})">◀</button>
            <span class="chap-num">第 ${currentChapter} 章</span>
            <button ${currentChapter>=max?'disabled':''} onclick="loadChapter('${currentBook}',${currentChapter+1})">▶</button>
            <span style="margin-left:auto;font-size:0.85em;color:#888;">共 ${max} 章</span>
        </div>`;

        html+='<div class="verses">';
        (data.verses||[]).forEach(v => {
            const ref = `${currentTranslation}:${currentBook}:${chapter}:${v.verse}`;
            html+=`<div class="verse" id="v${v.verse}" data-ref="${ref}" onclick="onVerseClick(event,'${ref}',${v.verse})">
                <sup class="verse-num">${v.verse}</sup>
                <span class="verse-text">${v.text}</span>
                <span class="verse-actions">
                    <button title="笔记" onclick="event.stopPropagation();openNoteModal('${ref}')">📝</button>
                    <button title="高亮" onclick="event.stopPropagation();toggleHighlight('${ref}',${v.verse})">🖍</button>
                </span>
            </div>`;
        });
        html+='</div>';
        mc.innerHTML = html;
        applyBookmarks();
        window.scrollTo(0,0);
    } catch(e) { mc.innerHTML = `<div class="error">加载失败: ${e.message}</div>`; }
}

// ============ Verse Interaction ============
function onVerseClick(e, ref, verse) {
    selectedVerse = ref;
    // Highlight selected verse
    document.querySelectorAll('.verse.selected').forEach(el => el.classList.remove('selected'));
    const el = document.getElementById('v'+verse);
    if (el) el.classList.add('selected');

    switchPanelTab(panelTab); // reload panel with this verse
}

// ============ Highlights ============
let highlightColor = 'yellow';
const HL_COLORS = ['yellow','green','blue','pink'];

function toggleHighlight(ref, verseNum) {
    const el = document.getElementById('v'+verseNum);
    if (!el) return;
    // Remove existing highlight
    let has = false;
    HL_COLORS.forEach(c => {
        if (el.classList.contains('hl-'+c)) { el.classList.remove('hl-'+c); has=true; }
    });
    if (has) return; // unhighlighted
    // Highlight with current color
    el.classList.add('hl-' + highlightColor);
    // Save bookmark
    saveBookmark(ref, highlightColor);
}

async function saveBookmark(ref, color) {
    try {
        await fetch(`${ANN}/bookmarks`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({verseRef:ref, color:color})
        });
    } catch(e) { console.error('Save bookmark:',e); }
}

function setHighlightColor(color) {
    highlightColor = color;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
    document.querySelector(`.color-dot.${color}`)?.classList.add('selected');
}

function applyBookmarks() {
    // Stored highlights applied via verse rendering (future enhancement)
}

// ============ Notes ============
function openNoteModal(ref, editId) {
    editNoteId = editId || null;
    selectedVerse = ref;
    const modal = document.getElementById('noteModal');
    modal.classList.add('show');
    document.getElementById('noteModalTitle').textContent = editId ? '编辑笔记' : '添加笔记 - ' + ref;
    document.getElementById('noteTitle').value = '';
    document.getElementById('noteContent').value = '';
    document.getElementById('noteContent').focus();
}

function closeNoteModal() {
    document.getElementById('noteModal').classList.remove('show');
    editNoteId = null;
}

async function saveNote() {
    const title = document.getElementById('noteTitle').value.trim();
    const content = document.getElementById('noteContent').value.trim();
    if (!content) { closeNoteModal(); return; }

    const ref = selectedVerse;
    try {
        let resp;
        if (editNoteId) {
            resp = await fetch(`${ANN}/notes/${editNoteId}`, {
                method:'PUT', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({title: title||null, content})
            });
        } else {
            resp = await fetch(`${ANN}/notes`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({verseRef:ref, title:title||null, content})
            });
        }
        closeNoteModal();
        switchPanelTab('notes');
    } catch(e) { console.error('Save note:',e); }
}

async function deleteNote(id) {
    if (!confirm('删除这条笔记？')) return;
    try {
        await fetch(`${ANN}/notes/${id}`, {method:'DELETE'});
        if (selectedVerse) switchPanelTab('notes');
    } catch(e) { console.error(e); }
}

// ============ Panel Tabs ============
function switchPanelTab(tab) {
    panelTab = tab;
    document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab'+(tab==='commentaries'?'Com':tab==='notes'?'Notes':'Refs')).classList.add('active');
    loadPanelContent();
}

async function loadPanelContent() {
    const pb = document.getElementById('panelBody');
    if (!selectedVerse) { pb.innerHTML = '<div class="loading">选择经文后在左侧点击节号</div>'; return; }

    const parts = selectedVerse.split(':');
    const book = parts[1] || ''; const ch = parseInt(parts[2])||1; const vs = parseInt(parts[3])||1;

    if (panelTab === 'commentaries') {
        pb.innerHTML = '<div class="loading">加载注释...</div>';
        try {
            const resp = await fetch(`${ANN}/commentaries/${book}/${ch}?verse=${vs}`);
            const data = await resp.json();
            const items = data.commentaries || [];
            if (items.length === 0) {
                pb.innerHTML = `<div class="loading">暂无 ${book} ${ch}:${vs} 的注释数据。<br><br><small>可通过 POST ${ANN}/import-commentary 导入注释书（如 Matthew Henry）</small></div>`;
                return;
            }
            let html = `<div style="font-size:0.8em;color:#888;margin-bottom:8px;">${book} ${ch}:${vs}</div>`;
            items.forEach(c => {
                html += `<div class="commentary-item">
                    <div class="source">📖 ${c.sourceName||c.source}</div>
                    <div>${c.text}</div>
                </div>`;
            });
            pb.innerHTML = html;
        } catch(e) { pb.innerHTML = '<div class="loading">注释服务未启动（需重建 text-service）</div>'; }
    } else if (panelTab === 'notes') {
        pb.innerHTML = '<div class="loading">加载笔记...</div>';
        try {
            const ref = encodeURIComponent(selectedVerse);
            const resp = await fetch(`${ANN}/notes/${ref}`);
            const data = await resp.json();
            const notes = data.notes || [];
            let html = `<button class="sm" onclick="openNoteModal('${selectedVerse}')" style="margin-bottom:8px;">✏️ 添加笔记</button>`;
            if (notes.length === 0) { html += '<div class="loading">暂无笔记</div>'; }
            notes.forEach(n => {
                html += `<div class="note-item">
                    <div class="note-actions">
                        <button class="sm" onclick="event.stopPropagation();openNoteModaledit('${selectedVerse}',${n.id},'${(n.title||'').replace(/'/g,"\\'")}','${(n.content||'').replace(/'/g,"\\'").substring(0,50)}');">✏️</button>
                        <button class="sm danger" onclick="event.stopPropagation();deleteNote(${n.id})">🗑</button>
                    </div>
                    ${n.title?`<div class="note-title">${n.title}</div>`:''}
                    <div>${n.content}</div>
                    <div class="note-date">${new Date(n.updatedAt||n.createdAt).toLocaleString('zh-CN')}</div>
                </div>`;
            });
            pb.innerHTML = html;
        } catch(e) { pb.innerHTML = '<div class="loading">笔记服务未启动</div>'; }
    } else if (panelTab === 'refs') {
        pb.innerHTML = '<div class="loading">加载交叉引用...</div>';
        try {
            const resp = await fetch(`${ANN}/crossrefs?translation=${currentTranslation}&book=${book}&chapter=${ch}&verse=${vs}`);
            const data = await resp.json();
            const refs = data.crossReferences || [];
            let html = `<div style="font-size:0.8em;color:#888;margin-bottom:8px;">${book} ${ch}:${vs}</div>`;
            if (refs.length === 0) { html += '<div class="loading">暂无交叉引用</div>'; }
            refs.forEach(r => {
                html += `<div class="crossref-item" onclick="navigateCrossRef('${r}')">🔗 ${r}</div>`;
            });
            pb.innerHTML = html;
        } catch(e) { pb.innerHTML = '<div class="loading">引用服务未启动</div>'; }
    }
}

async function navigateCrossRef(ref) {
    // ref format: "PSA.23.1"
    const parts = ref.split('.');
    if (parts.length >= 3) {
        const bk = parts.slice(0, parts.length-2).join('.');
        const ch = parseInt(parts[parts.length-2]);
        await selectBook(bk, ch);
        loadChapter(bk, ch);
    }
}

function togglePanel() {
    const panel = document.getElementById('rightPanel');
    panel.classList.toggle('collapsed');
}

function openNoteModaledit(ref, id, title, content) {
    editNoteId = id;
    selectedVerse = ref;
    const modal = document.getElementById('noteModal');
    modal.classList.add('show');
    document.getElementById('noteModalTitle').textContent = '编辑笔记';
    document.getElementById('noteTitle').value = title || '';
    document.getElementById('noteContent').value = content || '';
}

// ============ Search & Random ============
async function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    const mc = document.getElementById('mainContent');
    mc.innerHTML = '<div class="loading">搜索中...</div>';
    try {
        const resp = await fetch(`/api/v1/search?q=${encodeURIComponent(q)}&translation=${currentTranslation}`,{headers:{'Accept':'application/json'}});
        if (resp.ok) { const data = await resp.json(); renderSearchResults(data); return; }
    } catch(e) {}
    mc.innerHTML = '<div class="error">搜索服务暂不可用，尝试直接输入 "John 3" 跳转</div>';
}

function renderSearchResults(data) {
    const mc = document.getElementById('mainContent');
    const results = data.results || [];
    if (results.length === 0) { mc.innerHTML = '<div class="welcome"><h2>未找到结果</h2><p>请尝试其他关键词</p></div>'; return; }
    let html = `<div class="search-results"><h3>搜索结果 (${results.length})</h3>`;
    results.forEach(r => { html+=`<div class="search-result" onclick="loadChapter('${r.book_id}',${r.chapter})"><div class="ref">${r.reference||r.book_id+' '+r.chapter+':'+r.verse}</div><div class="snippet">${r.text||''}</div></div>`; });
    html+='</div>';
    mc.innerHTML = html;
}

async function showRandom() {
    const mc = document.getElementById('mainContent');
    mc.innerHTML = '<div class="loading">获取随机经文...</div>';
    try {
        const resp = await fetch(`${API}/${currentTranslation}/random`);
        const data = await resp.json();
        if (data.error) { mc.innerHTML = `<div class="error">${data.message}</div>`; return; }
        let html = `<div class="random-card">
            <div class="ref">📖 ${data.reference}</div>
            <div class="text">${data.text}</div>
            <div class="actions">
                <button onclick="loadChapter('${data.book_id}',${data.chapter})">阅读上下文</button>
                <button class="secondary" onclick="showRandom()">🎲 再来一节</button>
            </div></div>`;
        html += `<div class="translation-bar"><strong>${(data.translation_id||'').toUpperCase()}</strong> · ${data.book_name} ${data.chapter}</div>`;
        html += `<div class="chapter-nav"><button onclick="loadChapter('${data.book_id}',${data.chapter})">查看整章</button></div>`;
        mc.innerHTML = html;
    } catch(e) { mc.innerHTML = `<div class="error">获取失败: ${e.message}</div>`; }
}

function onTranslationChange() {
    currentTranslation = document.getElementById('translationSelect').value;
    currentBook = null; currentChapter = null;
    loadBooks();
    document.getElementById('mainContent').innerHTML = '<div class="welcome"><h2>选择书卷开始阅读</h2></div>';
}

function handleHash() {
    const hash = window.location.hash.slice(1);
    if (!hash) return;
    const parts = hash.split('/');
    if (parts.length >= 2) {
        const check = setInterval(() => {
            if (booksCache.length > 0) { clearInterval(check); selectBook(parts[1],1); }
        }, 100);
    }
}
window.addEventListener('hashchange', handleHash);

// Close modal on overlay click
document.getElementById('noteModal').addEventListener('click', function(e) {
    if (e.target === this) closeNoteModal();
});

init().then(() => handleHash());
</script>
</body>
</html>
