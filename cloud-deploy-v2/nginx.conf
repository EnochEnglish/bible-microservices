# Bible Microservices — Nginx Reverse Proxy Config
# Place at: /etc/nginx/sites-available/bible
# Enable:    sudo ln -s /etc/nginx/sites-available/bible /etc/nginx/sites-enabled/
# Verify:    sudo nginx -t
# Reload:    sudo systemctl reload nginx

# ── HTTP server (plain) ──
server {
    listen 80;
    server_name your-domain.com;  # ← REPLACE with your domain or server IP

    # Maximum upload size for module imports
    client_max_body_size 100m;

    # ── Static frontend + API proxy ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

