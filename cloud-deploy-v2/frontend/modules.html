<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模块管理 | Bible</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { margin:0; padding:0; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background: #f5f5f5; }
  .mgmt-nav { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#fff; border-bottom:1px solid #ddd; position:sticky; top:0; z-index:10; }
  .mgmt-nav a { color:#1a73e8; text-decoration:none; font-size:0.9rem; }
  .mgmt-nav h2 { margin:0; font-size:1.1rem; flex:1; }
  .mgmt-nav .nav-links { display:flex; gap:8px; }
  .mgmt-nav .nav-links a { padding:4px 10px; border-radius:4px; }
  .mgmt-nav .nav-links a.active { background:#1a73e8; color:#fff; }
  .mgmt-body { max-width:900px; margin:0 auto; padding:16px; }
  .modules-toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
  .modules-tabs { display:flex; gap:4px; }
  .modules-tab { padding:6px 14px; border:1px solid #ccc; background:#fff; border-radius:4px; cursor:pointer; font-size:0.85rem; }
  .modules-tab.active { background:#1a73e8; color:#fff; border-color:#1a73e8; }
  .modules-source { display:flex; align-items:center; gap:4px; margin-left:auto; }
  .modules-source select, .modules-source input { padding:6px; border:1px solid #ccc; border-radius:4px; font-size:0.85rem; }
  .repo-mgr-btn { padding:6px 10px; background:#f0f0f0; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:0.85rem; }
  .modules-search input { padding:6px 10px; border:1px solid #ccc; border-radius:4px; font-size:0.85rem; width:150px; }
  .modules-search select { padding:6px; border:1px solid #ccc; border-radius:4px; font-size:0.85rem; }
  .module-card { display:flex; align-items:center; gap:10px; padding:10px 12px; margin:4px 0; background:#fff; border:1px solid #e0e0e0; border-radius:6px; }
  .module-card .mod-info { flex:1; min-width:0; }
  .module-card .mod-name { font-weight:600; font-size:0.9rem; }
  .module-card .mod-desc { font-size:0.8rem; color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .module-card .mod-badge { display:inline-block; padding:1px 6px; border-radius:3px; font-size:0.7rem; margin-right:4px; }
  .badge-bible { background:#e3f2fd; color:#1565c0; }
  .badge-commentary { background:#fce4ec; color:#c62828; }
  .badge-dictionary { background:#fff3e0; color:#e65100; }
  .badge-general { background:#e8f5e9; color:#2e7d32; }
  .badge-devotion { background:#f3e5f5; color:#7b1fa2; }
  .badge-other { background:#eceff1; color:#546e7a; }
  .module-card button { padding:5px 12px; border:none; border-radius:4px; cursor:pointer; font-size:0.8rem; white-space:nowrap; }
  .btn-install { background:#1a73e8; color:#fff; }
  .btn-install:hover { background:#1557b0; }
  .btn-remove { background:#dc3545; color:#fff; }
  .btn-remove:hover { background:#b02a37; }
  .btn-installing { background:#ccc; color:#666; cursor:wait; }
  .modules-status { margin-top:10px; padding:8px 12px; border-radius:4px; font-size:0.85rem; display:none; }
  .modules-status.show { display:block; }
  .status-ok { background:#e8f5e9; color:#2e7d32; }
  .status-err { background:#ffebee; color:#c62828; }
  .status-info { background:#e3f2fd; color:#1565c0; }
  .loading { text-align:center; padding:20px; color:#999; }
  .repo-panel { margin-top:16px; padding:12px; background:#fff; border:1px solid #e0e0e0; border-radius:6px; display:none; }
  .repo-panel.show { display:block; }
  .repo-item { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #f0f0f0; }
  .repo-item .repo-name { font-weight:600; flex:1; font-size:0.85rem; }
  .repo-item .repo-url { font-size:0.78rem; color:#666; }
  .repo-item button { padding:4px 10px; border:1px solid #dc3545; color:#dc3545; background:#fff; border-radius:4px; cursor:pointer; font-size:0.78rem; }
  .repo-add-form { margin-top:10px; display:none; }
  .repo-add-form.show { display:block; }
  .repo-add-form input { padding:6px; border:1px solid #ccc; border-radius:4px; font-size:0.85rem; margin-right:6px; width:200px; }
  .repo-add-hint { font-size:0.75rem; color:#999; margin:6px 0; }
  .repo-footer { margin-top:10px; }
</style>
</head>
<body>

<div class="mgmt-nav">
  <h2>📦 模块管理</h2>
  <div class="nav-links">
    <a href="index.html">📖 回到阅读器</a>
    <a href="admin.html">⚙️ 用户管理</a>
  </div>
</div>

<div class="mgmt-body">
  <!-- No access prompt -->
  <div id="noAccess" style="text-align:center;padding:40px;color:#999;display:none">
    <p id="noAccessMsg"></p>
    <p><a href="index.html">返回阅读器登录</a></p>
  </div>

  <!-- Module content (admin only) -->
  <div id="moduleContent" style="display:none">
    <div class="modules-toolbar">
      <div class="modules-tabs">
        <button class="modules-tab active" onclick="switchTab('installed')">📋 已安装</button>
        <button class="modules-tab" onclick="switchTab('browse')">🔍 可安装</button>
      </div>
      <div class="modules-source">
        <label>数据源:</label>
        <select id="sourceSelect" onchange="switchSource(this.value)"></select>
        <button class="repo-mgr-btn" onclick="toggleRepoPanel()">⚙</button>
      </div>
      <div class="modules-search">
        <input type="text" id="searchInput" placeholder="搜索模块..." oninput="filterList()">
        <select id="categoryFilter" onchange="filterList()">
          <option value="">全部类型</option>
          <option value="BIBLE">📖 圣经</option>
          <option value="COMMENTARY">💬 注释</option>
          <option value="DICTIONARY">📚 词典</option>
          <option value="GENERAL_BOOK">📔 通用</option>
          <option value="DAILY_DEVOTION">📅 灵修</option>
        </select>
      </div>
    </div>

    <div id="listContainer"><div class="loading">加载中...</div></div>
    <div id="statusBar" class="modules-status"></div>

    <!-- Repo Manager -->
    <div class="repo-panel" id="repoPanel">
      <h3 style="margin:0 0 8px 0;font-size:0.95rem">⚙ 仓库管理</h3>
      <div id="repoList"></div>
      <div class="repo-add-form" id="repoAddForm">
        <input type="text" id="repoAddName" placeholder="仓库名称（如：我的镜像站）">
        <input type="text" id="repoAddUrl" placeholder="仓库地址（如：https://example.com/sword）">
        <div class="repo-add-hint">只需提供网址。系统会自动找到 mods.d.tar.gz 和模块包。</div>
        <div style="margin-top:6px;display:flex;gap:6px">
          <button onclick="saveRepo()" style="padding:6px 14px;background:#1a73e8;color:#fff;border:none;border-radius:4px;cursor:pointer">💾 保存</button>
          <button onclick="cancelAddRepo()" style="padding:6px 14px;background:#666;color:#fff;border:none;border-radius:4px;cursor:pointer">取消</button>
        </div>
      </div>
      <div class="repo-footer"><button onclick="showAddRepo()" style="padding:6px 14px;background:#f0f0f0;border:1px solid #ccc;border-radius:4px;cursor:pointer">➕ 添加仓库</button></div>
    </div>
  </div><!-- end moduleContent -->
</div><!-- end mgmt-body -->

<script src="js/config.js?v=20260616c"></script>
<script>
// ── Init: auth check ──
var API = APP_CONFIG.apiBase;
var token='', isAdmin=false;
(function init(){
  try {
    var a = JSON.parse(localStorage.getItem('bible_auth'));
    if (a && a.token) {
      token = a.token;
      if (a.user && a.user.role === 'ADMIN') isAdmin = true;
    }
  } catch(e) {}

  if (!isAdmin) {
    document.getElementById('noAccess').style.display = 'block';
    document.getElementById('noAccessMsg').textContent = token ?
      '需要管理员权限才能访问此页面。' :
      '请先登录管理员账户。';
    return;
  }
  document.getElementById('moduleContent').style.display = 'block';
  loadSources();
})();

// ── Config ──
var API = APP_CONFIG.apiBase;
var state = { tab: 'installed', sourceId: 'crosswire', category: '', search: '', installed: [], available: [] };

function authHeader() {
  return token ? {'Authorization':'Bearer '+token} : {};
}

// ── Source list ──
function loadSources() {
  fetch(API + '/text/repos').then(function(r){return r.json()}).then(function(d){
    var repos = d.repos || [];
    var sel = document.getElementById('sourceSelect');
    sel.innerHTML = '';
    for (var i=0; i<repos.length; i++) {
      var r = repos[i];
      var opt = document.createElement('option');
      opt.value = r.id || r.name;
      opt.textContent = r.name || r.id;
      sel.appendChild(opt);
    }
    if (repos.length>0) { state.sourceId = repos[0].id || repos[0].name; sel.value = state.sourceId; }
    loadModules();
  }).catch(function(){ loadModules(); });
}

function switchSource(id) { state.sourceId = id; loadModules(); }

// ── Load modules ──
function loadModules() {
  var mc = document.getElementById('listContainer');
  mc.innerHTML = '<div class="loading">加载中...</div>';
  fetch(API + '/sword/modules/available?source=' + encodeURIComponent(state.sourceId))
    .then(function(r){return r.json()}).then(function(d){
      state.available = d.modules || d;
      loadInstalled();
  }).catch(function(){
    loadInstalled();
  });
}

function loadInstalled() {
  fetch(API + '/sword/modules').then(function(r){return r.json()}).then(function(d){
    state.installed = d.modules || [];
    renderList();
  }).catch(function(){ renderList(); });
}

// ── Render ──
function renderList() {
  var container = document.getElementById('listContainer');
  var list = state.tab === 'installed' ? state.installed : state.available;
  if (!list || !list.length) { container.innerHTML = '<div class="loading">暂无模块</div>'; return; }

  var installedNames = {};
  for (var i=0;i<state.installed.length;i++) { installedNames[state.installed[i].name||state.installed[i].initials] = true; }

  var html = '';
  var cat = state.category;
  var q = (state.search||'').toLowerCase();

  for (var i=0;i<list.length;i++) {
    var m = list[i];
    var name = m.name||m.initials||'';
    var desc = m.description||'';
    var category = m.category||'';
    var isInstalled = !!installedNames[name];

    if (cat && category !== cat) continue;
    if (q && name.toLowerCase().indexOf(q)<0 && desc.toLowerCase().indexOf(q)<0) continue;
    if (state.tab==='installed' && !isInstalled) continue;

    var badgeClass = 'badge-other';
    var badgeText = category;
    if (category==='BIBLE') { badgeClass='badge-bible'; badgeText='圣经'; }
    else if (category==='COMMENTARY') { badgeClass='badge-commentary'; badgeText='注释'; }
    else if (category==='DICTIONARY') { badgeClass='badge-dictionary'; badgeText='词典'; }
    else if (category==='GENERAL_BOOK') { badgeClass='badge-general'; badgeText='通用'; }
    else if (category==='DAILY_DEVOTION') { badgeClass='badge-devotion'; badgeText='灵修'; }

    html += '<div class="module-card">'
      + '<div class="mod-info">'
      + '<div class="mod-name"><span class="mod-badge ' + badgeClass + '">' + badgeText + '</span>' + name + '</div>'
      + '<div class="mod-desc">' + (desc||'') + '</div>'
      + '</div>';

    if (isInstalled) {
      html += '<button class="btn-remove" onclick="removeModule(\'' + name + '\')">卸载</button>';
    } else {
      html += '<button class="btn-install" id="btn-' + name.replace(/[^a-zA-Z0-9]/g,'_') + '" onclick="installModule(\'' + name + '\')">安装</button>';
    }
    html += '</div>';
  }

  container.innerHTML = html || '<div class="loading">无匹配模块</div>';
}

function filterList() {
  state.search = document.getElementById('searchInput').value;
  state.category = document.getElementById('categoryFilter').value;
  renderList();
}

function switchTab(tab) {
  state.tab = tab;
  var tabs = document.querySelectorAll('.modules-tab');
  for (var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
  if (tab==='installed') tabs[0].classList.add('active');
  else tabs[1].classList.add('active');
  renderList();
}

// ── Install / Remove ──
function installModule(name) {
  var btn = document.getElementById('btn-' + name.replace(/[^a-zA-Z0-9]/g,'_'));
  if (btn) { btn.className = 'btn-installing'; btn.disabled = true; btn.textContent = '...'; }
  showStatus('正在安装 ' + name + '...', 'info');

  fetch(API + '/sword/modules/install/' + encodeURIComponent(name) + '?source=' + encodeURIComponent(state.sourceId), {
    method: 'POST', headers: authHeader()
  }).then(function(r){return r.json()}).then(function(d){
    if (d.success) {
      showStatus(name + ' 安装成功!', 'ok');
      state.installed.push({name:name, category: d.category||''});
      renderList();
      try { if (window.opener && window.opener.__reloadModules) window.opener.__reloadModules(); } catch(e){}
    } else {
      showStatus('安装失败: ' + (d.message||d.error||''), 'err');
    }
    if (btn) { btn.className = 'btn-install'; btn.disabled = false; btn.textContent = '安装'; }
    setTimeout(loadInstalled, 2500);
  }).catch(function(e){
    showStatus('安装出错: ' + e.message, 'err');
    if (btn) { btn.className = 'btn-install'; btn.disabled = false; btn.textContent = '安装'; }
  });
}

function removeModule(name) {
  if (!confirm('确定要卸载 ' + name + ' 吗?')) return;
  showStatus('正在卸载 ' + name + '...', 'info');
  fetch(API + '/sword/modules/uninstall/' + encodeURIComponent(name), {
    method: 'DELETE', headers: authHeader()
  }).then(function(r){return r.json()}).then(function(d){
    if (d.success) {
      showStatus(name + ' 已卸载', 'ok');
      for (var i=state.installed.length-1;i>=0;i--) { if (state.installed[i].name===name) state.installed.splice(i,1); }
      renderList();
    } else {
      showStatus('卸载失败: ' + (d.message||d.error||''), 'err');
    }
  }).catch(function(e){ showStatus('卸载出错: ' + e.message, 'err'); });
}

// ── Status ──
function showStatus(msg, type) {
  var s = document.getElementById('statusBar');
  s.textContent = msg; s.className = 'modules-status show status-' + (type||'info');
  setTimeout(function(){ s.classList.remove('show'); }, 4000);
}

// ── Repo Manager ──
function toggleRepoPanel() {
  var p = document.getElementById('repoPanel');
  p.classList.toggle('show');
  if (p.classList.contains('show')) loadRepos();
}

function loadRepos() {
  fetch(API + '/text/repos').then(function(r){return r.json()}).then(function(d){
    var repos = d.repos || [];
    var html = '';
    for (var i=0;i<repos.length;i++) {
      var r = repos[i];
      html += '<div class="repo-item">'
        + '<div class="repo-name">' + (r.name||r.id) + '</div>'
        + '<div class="repo-url">' + (r.url||'') + '</div>'
        + (String(r.id).indexOf('custom-')===0 ? '<button onclick="deleteRepo(\'' + (r.id||r.name) + '\')">删除</button>' : '')
        + '</div>';
    }
    document.getElementById('repoList').innerHTML = html || '<div style="color:#999">暂无仓库</div>';
  });
}

function showAddRepo() { document.getElementById('repoAddForm').classList.add('show'); }
function cancelAddRepo() {
  document.getElementById('repoAddForm').classList.remove('show');
  document.getElementById('repoAddName').value = '';
  document.getElementById('repoAddUrl').value = '';
}
function saveRepo() {
  var name = document.getElementById('repoAddName').value.trim();
  var url = document.getElementById('repoAddUrl').value.trim();
  if (!name||!url) { alert('请填写名称和地址'); return; }
  // Get current repos, add new one
  fetch(API + '/text/repos').then(function(r){return r.json()}).then(function(d){
    var repos = d.repos || [];
    var customs = [];
    for (var i=0;i<repos.length;i++) { if (String(repos[i].id).indexOf('custom-')===0) { customs.push({name:repos[i].name, baseUrl:repos[i].url}); } }
    customs.push({name:name, baseUrl:url});
    return fetch(API + '/text/repos', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({customRepositories:customs})
    });
  }).then(function(r){return r.json()}).then(function(d){
    if (d.success) {
      showStatus('仓库已添加', 'ok');
      cancelAddRepo(); loadRepos(); loadSources();
    } else { showStatus('添加失败', 'err'); }
  }).catch(function(e){ showStatus('出错: '+e.message, 'err'); });
}
function deleteRepo(id) {
  if (!confirm('确定删除仓库 ' + id + '?')) return;
  fetch(API + '/text/repos').then(function(r){return r.json()}).then(function(d){
    var repos = d.repos || [];
    var customs = [];
    for (var i=0;i<repos.length;i++) { if (String(repos[i].id).indexOf('custom-')===0 && repos[i].id!==id) { customs.push({name:repos[i].name, baseUrl:repos[i].url}); } }
    return fetch(API + '/text/repos', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({customRepositories:customs})
    });
  }).then(function(r){return r.json()}).then(function(d){
    if (d.success) { loadRepos(); loadSources(); showStatus('已删除', 'ok'); }
    else showStatus('删除失败', 'err');
  }).catch(function(e){ showStatus('出错: '+e.message, 'err'); });
}
</script>
</body>
</html>
