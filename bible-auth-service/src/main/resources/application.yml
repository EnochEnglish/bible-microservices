server:
  port: 8084

spring:
  application:
    name: bible-auth-service
  datasource:
    url: jdbc:h2:file:./data/auth-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# JWT
jwt:
  secret: bWljcm9zZXJ2aWNlcy1iaWJsZS1hdXRoLWp3dC1zZWNyZXQta2V5LTIwMjYtMDYtMTQ=
  expiration-ms: 86400000  # 24 hours

# Pre-seeded admin
app:
  admin:
    username: admin
    password: admin123  # Should be changed on first login

logging:
  level:
    com.bible.auth: INFO
