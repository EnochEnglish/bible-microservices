server:
  port: 8081

spring:
  application:
    name: bible-text-service

  jackson:
    default-property-inclusion: non_null

  # H2 开发数据库
  datasource:
    url: jdbc:h2:file:C:/Users/PC/.qclaw/workspace-v733kxt9elzfv7u1/bible-microservices/data/text-db;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;TRACE_LEVEL_FILE=0
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console（开发时开启）
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # 缓存
  cache:
    type: simple

# 经文服务配置
bible:
  text:
    default-translation: web
  module-service:
    url: http://localhost:8083

logging:
  level:
    com.bible.text: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE