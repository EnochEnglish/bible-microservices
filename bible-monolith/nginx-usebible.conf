# nginx config for usebible.com (bible-monolith deployment)
# Static frontend + API proxy to single monolith process on :8080

server {
    listen 80;
    server_name usebible.com www.usebible.com 8.222.165.245;

    # Root: static frontend files
    root /opt/bible-microservices/frontend;
    index index.html;

    # API proxy to monolith (single backend on port 8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # H2 Console (optional, for debugging)
    location /h2-console/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Enable gzip for frontend assets
    gzip on;
    gzip_types text/css application/javascript application/json text/html;
    gzip_min_length 256;

    # Logs
    access_log /var/log/nginx/usebible-access.log;
    error_log /var/log/nginx/usebible-error.log;
}
