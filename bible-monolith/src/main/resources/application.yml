# ============================================================
# bible-monolith - 开发环境配置 (dev)
#
# 启动: java -jar bible-monolith.jar
#   → 默认 profile = dev
#
# 特点: 明文密码、H2 控制台开、DEBUG 日志、JWT 24h
#
# UAT 环境: java -jar bible-monolith.jar --spring.profiles.active=uat
#   → 加载 application-uat.yml（不提交代码库，部署时单独放置）
#
# 生产环境: java -jar bible-monolith.jar --spring.profiles.active=prod
#   → 加载 application-prod.yml（不提交代码库，部署时单独放置）
# ============================================================

server:
  port: 8080

spring:
  application:
    name: bible-monolith
  profiles:
    active: dev

  jackson:
    default-property-inclusion: non_null

  # --- H2 DataSource ---
  datasource:
    url: jdbc:h2:file:./data/text-db;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;TRACE_LEVEL_FILE=0
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 控制台（dev 开启）
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=30m

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# ===== JWT =====
jwt:
  secret: bWljcm9zZXJ2aWNlcy1iaWJsZS1hdXRoLWp3dC1zZWNyZXQta2V5LTIwMjYtMDYtMTQ=
  expiration-ms: 86400000  # 24h

# ===== Admin 预置账户 =====
app:
  admin:
    username: admin
    password: admin123
  principal:
    username: principal
    password: principal123
  bcrypt-enabled: false  # dev: 明文密码

# ===== Bible Text Service =====
bible:
  text:
    default-translation: web
  search:
    index-path: ./data/search-index
  text-service:
    url: http://localhost:8080
  module-service:
    url: http://localhost:8080
  data:
    sources-url: https://raw.githubusercontent.com/seven1m/open-bibles/main/

# ===== SWORD =====
sword:
  modules-path: data/sword-mods
  data-path: data/sword-mods

# ===== Knowledge Base =====
kb:
  node-service-url: http://localhost:3000
  library-path: frontend/library-data
  sources:
    bible:
      translations: cuv_gb

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: when-authorized

# ===== Logging =====
logging:
  level:
    com.bible.monolith: DEBUG
    org.crosswire: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"
