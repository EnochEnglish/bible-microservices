<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Reader / 圣经阅读器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="logo">📖 Bible / 圣经</div>
      <select id="translationSelect"></select>
      <span id="interlinearBtn" style="display:none"></span>
      <select id="langToggle">
        <option value="bilingual">🌐 双语</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="en">🇺🇸 English</option>
      </select>
      <select id="compareSelect">
        <option value="">📐 对照模式</option>
      </select>
      <div class="search-box"><input type="text" id="searchBox" placeholder="搜索经文..."></div>
      <button id="dictBtn" title="Bible Dictionary" onclick="openDictPopup()">📚</button>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <div id="chapterGrid" class="chapters"></div>
      <div id="bookList"></div>
    </div>

    <!-- Main Content -->
    <div class="main">
      <div id="readerView">
        <div class="chapter-header" id="chapterHeader"></div>
        <!-- Compare bar shows when bilingual comparison is active -->
        <div id="compareBar" class="compare-bar" style="display:none">
          <label>📐 对照:</label>
          <select id="compareTrans2"></select>
          <div class="close-btn" id="compareClose" title="关闭对照">✕</div>
        </div>
        <div class="chapter-nav-top" id="chapterNavTop"></div>
        <div id="verseContent" class="loading">加载中...</div>
        <div class="chapter-nav" id="chapterNav"></div>
      </div>
      <div id="searchResults" style="display:none"></div>
    </div>

    <!-- Commentary Panel -->
    <div class="tsk-panel" id="tskContent">
      <div class="commentary-tabs" id="commentaryTabs"></div>
      <div id="commentaryBody">
        <div class="loading">加载中...</div>
      </div>
    </div>

    <!-- Dictionary Panel (Easton/ISBE/Nave) -->
    <div class="strongs-overlay" id="dictOverlay" style="display:none" onclick="closeDictPopup()">
      <div class="strongs-popup" id="dictPopup" onclick="event.stopPropagation()">
        <div class="strongs-popup-header">
          <span id="dictPopupTitle">📚 Bible Dictionary</span>
          <span class="strongs-popup-close" onclick="closeDictPopup()">✕</span>
        </div>
        <div class="dict-search-area">
          <select id="dictSourceSelect"></select>
          <input type="text" id="dictSearchInput" placeholder="Search dictionary..." onkeyup="if(event.key==='Enter')searchDictionary()">
          <button onclick="searchDictionary()">🔍</button>
        </div>
        <div id="dictPopupBody">
          <div style="padding:2rem;text-align:center;color:var(--muted)">Select a dictionary and search for a term</div>
        </div>
      </div>
    </div>

    <!-- Strong's Dictionary Popup -->
    <div class="strongs-overlay" id="strongsOverlay" style="display:none" onclick="closeStrongsPopup()">
      <div class="strongs-popup" id="strongsPopup" onclick="event.stopPropagation()">
        <div class="strongs-popup-header">
          <span id="strongsPopupTitle">📖 Strong's Dictionary</span>
          <span class="strongs-popup-close" onclick="closeStrongsPopup()">✕</span>
        </div>
        <div id="strongsPopupBody"></div>
      </div>
    </div>

    <!-- Morphology Code Help Popup -->
    <div class="strongs-overlay" id="morphHelpOverlay" style="display:none" onclick="closeMorphHelp()">
      <div class="strongs-popup morph-help-popup" id="morphHelpPopup" onclick="event.stopPropagation()">
        <div class="strongs-popup-header">
          <span id="morphHelpTitle">📘 Morphology Codes / 语法编码对照表</span>
          <span class="strongs-popup-close" onclick="closeMorphHelp()">✕</span>
        </div>
        <div id="morphHelpBody"></div>
      </div>
    </div>
    <!-- Strong's hover tooltip -->
    <div id="strongsTooltip" class="strongs-tooltip" style="display:none"></div>
  </div>
  <script src="js/config.js?v=20260609d"></script>
  <script src="js/api.js?v=20260609d"></script>
  <script src="js/app.js?v=20260609d"></script>
</body>
</html>
